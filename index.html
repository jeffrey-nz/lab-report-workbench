<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Report Workbench</title>
<meta name="description" content="Turn a course data workbook into checked figures, the right statistical test, and a drafted figure legend. Runs entirely in your browser.">
<meta name="color-scheme" content="light dark">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f5d56'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round' fill='none'%3E%3Cpath d='M7 24V9'/%3E%3Cpath d='M7 24h18'/%3E%3Cpath d='M12 20v-6M18 20v-10M24 20v-4'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/components.css">
<link rel="stylesheet" href="./styles/views.css">
</head>

<body>
<a class="visually-hidden" href="#view-root" id="skip-link">Skip to the current step</a>

<header class="masthead">
  <div class="masthead-in page">
    <div class="brand">
      <strong id="brand-name">Lab Report Workbench</strong>
      <span id="brand-tagline">workbook &rarr; figures &rarr; statistics &rarr; draft</span>
    </div>
    <nav class="steps" id="steps" aria-label="Stages"></nav>
    <div class="segmented" id="language-toggle" role="group"></div>
    <button type="button" class="btn btn--icon" id="theme-toggle"
            title="Switch between light and dark" aria-label="Switch between light and dark">
      Theme
    </button>
  </div>
</header>

<main class="page" id="view-root" role="region" aria-live="polite"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <p class="page" style="padding-block:40px">
    This tool reads your spreadsheet in the browser, so it needs JavaScript enabled.
    このツールはブラウザ内で表計算ファイルを読み込むため、JavaScript を有効にしてください。
  </p>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
